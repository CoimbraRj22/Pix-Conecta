
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pix | CONecta+</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#fff;font-family:Arial,sans-serif;padding:24px 16px}
main{max-width:420px;margin:20px auto;background:#1b1c22;border:1px solid #333640;border-radius:22px;padding:26px 20px;text-align:center}
.brand{font-size:25px;font-weight:bold;color:#1685ff}
.brand span{color:#fff}
.tagline{font-size:12px;color:#aeb4c0;margin-top:5px}
h1{font-size:25px;margin:30px 0 8px}
p{color:#c4c8d1;line-height:1.5;font-size:15px}
.qr{background:white;border-radius:12px;padding:12px;width:240px;max-width:100%;margin:22px auto}
.qr img{display:block;width:100%;height:auto}
button{width:100%;padding:16px 10px;border:0;border-radius:10px;background:#16834a;color:white;font-weight:bold;font-size:16px;cursor:pointer}
.note{font-size:12px;color:#aeb4c0;margin-top:18px}
footer{margin-top:28px;font-size:12px;color:#858b98}
</style>
</head>
<body>
<main>
  <div class="brand">CON<span>ecta+</span></div>
  <div class="tagline">PAGAMENTO FÁCIL, CONEXÃO INTELIGENTE</div>
  <h1>Pague com Pix</h1>
  <p>Escaneie o QR Code com outro celular ou copie o código Pix para pagar pelo aplicativo do seu banco.</p>
  <div class="qr">
    <img id="qrcode" alt="QR Code Pix">
  </div>
  <button id="copiar">COPIAR CÓDIGO PIX</button>
  <p id="mensagem" role="status"></p>
  <div class="note">Confira o nome do recebedor e informe o valor no seu banco antes de confirmar.</div>
  <footer>Uma solução CONecta+</footer>
</main>
<script>
const PIX = "COLE_SEU_PIX_COPIA_E_COLA_AQUI";
const botao = document.getElementById("copiar");
const mensagem = document.getElementById("mensagem");
const qr = document.getElementById("qrcode");

if (PIX && PIX !== "COLE_SEU_PIX_COPIA_E_COLA_AQUI") {
  qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(PIX);
} else {
  qr.style.display = "none";
  document.querySelector(".qr").innerHTML = "<p style='color:#333'>QR Code será exibido após configurar o Pix.</p>";
  botao.disabled = true;
  botao.textContent = "PIX AINDA NÃO CONFIGURADO";
}

botao.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(PIX);
    mensagem.textContent = "Código Pix copiado! Abra seu banco e cole o código.";
  } catch (e) {
    mensagem.textContent = "Não foi possível copiar. Tente abrir a página no navegador.";
  }
});
</script>
</body>
</html>
