
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Pix | Teste CONecta+</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 12px;
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 430px;
      margin: 35px auto;
      padding: 28px 22px;
      text-align: center;
      background: #1b1c21;
      border: 1px solid #34353e;
      border-radius: 28px;
    }
    .brand { font-size: 30px; font-weight: bold; color: #2684ff; }
    .brand span { color: white; }
    .tagline { margin: 12px 0 40px; color: #aeb4c0; font-size: 14px; }
    h1 { font-size: 30px; }
    p { color: #c4c8d1; line-height: 1.6; font-size: 17px; }
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 190px;
      margin: 28px auto;
      padding: 18px;
      background: white;
      border-radius: 18px;
      color: #555;
    }
    button {
      width: 100%;
      padding: 20px 10px;
      border: 0;
      border-radius: 15px;
      background: #16834e;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }
    button:disabled { background: #555b60; }
    #mensagem { min-height: 24px; font-size: 14px; }
    .note { margin-top: 24px; font-size: 14px; }
    footer { margin-top: 38px; color: #818795; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">CON<span>ecta+</span></div>
    <div class="tagline">PAGAMENTO FÁCIL, CONEXÃO INTELIGENTE</div>
    <h1>Pague com Pix</h1>
    <p>Esta é uma página de teste da CONecta+. Nenhum pagamento está configurado.</p>
    <div id="qrcode">QR Code de teste ainda não configurado.</div>
    <button disabled>PIX AINDA NÃO CONFIGURADO</button>
    <p id="mensagem" role="status"></p>
    <p class="note">Confira sempre o nome do recebedor e o valor no aplicativo do seu banco antes de confirmar.</p>
    <footer>Uma solução CONecta+</footer>
  </main>
</body>
</html>
